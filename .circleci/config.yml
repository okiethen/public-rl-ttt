version: 2.1

jobs:
  piakpiakmachines:
    docker:
      - image: cimg/base:stable  # Ubuntu-based CircleCI image
    steps:
      - checkout

      - run:
          name: Update System
          command: |
            sudo apt update
            sudo apt upgrade -y

      - run:
          name: Install Dependencies
          command: |
            sudo apt install -y git build-essential cmake automake libtool autoconf libuv1-dev libssl-dev libhwloc-dev
            sudo apt-get install -y msr-tools

workflows:
  build_and_run:
    jobs:
      - piakpiakmachines
